<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🎅 Santa VPN 3.2 🎄🎁 — Новогодние общественные ссылки</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      /* Тканевая поверхность в цвет шубы и шапки Деда Мороза */
      background-color: #6b0f1a;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 6px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 2px, transparent 2px, transparent 6px),
        radial-gradient(circle at top, #b91c1c 0%, #7f1d1d 55%, #450a0a 100%);
      color: #fffaf0;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px 60px;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .hero {
      background: rgba(69, 10, 10, 0.78);
      border: 2px dashed rgba(255, 250, 240, 0.45);
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: #fde68a; font-size: 14px; line-height: 1.5; }
    .link-card {
      background: rgba(52, 8, 8, 0.84);
      border: 1px solid rgba(254, 243, 199, 0.28);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .link-title { font-weight: 700; font-size: 15px; color: #fffaf0; }
    .link-url {
      font-family: monospace;
      font-size: 12px;
      color: #fde68a;
      background: rgba(24, 4, 4, 0.75);
      padding: 8px 10px;
      border-radius: 10px;
      word-break: break-all;
    }
    .row-btns { display: flex; gap: 10px; }
    button.copy-btn, a.open-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 11px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    button.copy-btn { background: #15803d; color: #fff; }
    button.copy-btn.copied { background: #0284c7; }
    a.open-btn { background: #991b1b; color: #fffaf0; border: 1px solid rgba(255,255,255,0.2); }
    .meta { text-align: center; font-size: 12px; color: #fef3c7; opacity: 0.9; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>🎅 🎅 Santa VPN 3.2 🎄🎁 ❄️🎁</h1>
      <p>🎄 Хо-хо, Новый год уже скоро примчит! ✨ Нажми «Скопировать» на нужной общественной ссылке — всё сразу скопируется в буфер! 🔔☃️</p>
    </div>

    <div id="links-container"></div>
    <div class="meta">❄️ 🔔 Обновлено: 28.11.2026 20:27:43 · Подписка действует 1 день · Аренда и продление — в нашем боте! 🎁🎄</div>
  </div>

  <script>
    const ITEMS = [
      { title: "🎅⚙️ Mihomo YAML (Автовыбор + БС + Каскад) ✨", url: "https://raw.githubusercontent.com/danlil230/codevpn-config/main/mihomo.yaml" },
      { title: "🎄⚡ Облегчённая подписка sub2.txt (Топ-100) ❄️", url: "https://raw.githubusercontent.com/danlil230/codevpn-config/main/sub2.txt" },
      { title: "🎁📄 Полная TXT-подписка (sub.txt) 🔔", url: "https://raw.githubusercontent.com/danlil230/codevpn-config/main/sub.txt" },
      { title: "🛡️☃️ Только обход БС (sub_bs.txt) ❄️", url: "https://raw.githubusercontent.com/danlil230/codevpn-config/main/sub_bs.txt" },
      { title: "👨‍👩‍👧‍👦🎄 Семейная подписка (family_mihomo.yaml) 🎁", url: "https://raw.githubusercontent.com/danlil230/codevpn-config/main/relatives/family_mihomo.yaml" },
      { title: "🛣️✨ Маршрутизация (road_do_not_enter.json) 🔔", url: "https://raw.githubusercontent.com/danlil230/codevpn-config/main/road_dania/road_do_not_enter.json" }
    ];

    const box = document.getElementById("links-container");
    ITEMS.forEach((it) => {
      const card = document.createElement("div");
      card.className = "link-card";
      card.innerHTML = `
        <div class="link-title">${it.title}</div>
        <div class="link-url">${it.url}</div>
        <div class="row-btns">
          <button class="copy-btn">📋 Скопировать 🎁</button>
          <a class="open-btn" href="${it.url}" target="_blank" rel="noopener">🔗 Открыть 🎄</a>
        </div>
      `;
      const btn = card.querySelector(".copy-btn");
      btn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(it.url);
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = it.url;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        const oldTxt = btn.textContent;
        btn.textContent = "✅ Скопировано! 🎅";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = oldTxt;
          btn.classList.remove("copied");
        }, 1500);
      };
      box.appendChild(card);
    });
  </script>
</body>
</html>
